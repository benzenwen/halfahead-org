<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typing lab · Half Ahead</title>
  <style>
    :root {
      --bg: #141210;
      --text: #efe6d6;
      --muted: #b9ad9a;
      --signal: #ff7a55;
      --condensed: "Arial Narrow", "Helvetica Neue", "Roboto Condensed", sans-serif;
      color-scheme: dark;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    /* The textarea is the real input; the canvas draws what it holds. */
    #type {
      position: fixed; inset: 0; width: 100%; height: 100%; box-sizing: border-box;
      /* Roughly over the drawn block, centred a little above the middle, so
         selection and IME popups land near it; a readable measure. */
      margin: 0; padding: 36vh max(1rem, calc((100% - 70ch) / 2)) 3rem; border: 0; resize: none;
      background: transparent; color: transparent; caret-color: transparent;
      font: 1.125rem/1.6 var(--condensed);
    }
    #type::selection { background: rgba(255, 122, 85, 0.25); }
    #type:focus { outline: none; }
    #type:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }
    .bar {
      position: fixed; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap;
      justify-content: space-between; gap: 0.25rem 1.5rem; padding: 0.75rem 1rem;
      font-family: var(--condensed); font-size: 0.8125rem; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--muted); pointer-events: none;
    }
    .bar > * { pointer-events: auto; margin: 0; }
    .bar a { color: var(--text); }
    .bar a:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
    /* ?debug only: numbers for screen recordings, in the corner below the
       text block, never in the way of the pointer. As wide as it needs up to
       the viewport, then wrapping, so no line is ever cut off. */
    #debug {
      position: fixed; left: 0.5rem; bottom: 0.5rem; margin: 0; padding: 0.35rem 0.5rem;
      max-width: calc(100vw - 1rem); box-sizing: border-box; white-space: pre-wrap;
      font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace;
      color: var(--text); background: rgba(0, 0, 0, 0.7); pointer-events: none;
    }
    #debug[hidden] { display: none; }
    /* A quiet picker in the corner opposite the debug panel. */
    .styles {
      position: fixed; right: 0.5rem; bottom: 0.5rem; display: flex; align-items: center;
      gap: 0.5rem; font-family: var(--condensed); font-size: 0.8125rem;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted);
    }
    .styles select {
      font: inherit; letter-spacing: 0.06em; color: var(--text); background: var(--bg);
      border: 1px solid rgba(185, 173, 154, 0.35); border-radius: 0.25rem; padding: 0.2rem 0.35rem;
    }
    .styles select:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
    .styles .sound { display: flex; align-items: center; gap: 0.3rem; }
    .styles input[type="checkbox"] { margin: 0; accent-color: var(--signal); }
    .styles input[type="checkbox"]:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <label class="sr-only" for="type">Type here</label>
  <textarea id="type" autofocus spellcheck="true" autocomplete="off"></textarea>
  <div class="bar">
    <p id="status" role="status">Starting the renderer…</p>
    <a href="../">Back to Half Ahead</a>
  </div>
  <div class="styles">
    <label for="style">Motion style</label>
    <select id="style" aria-keyshortcuts="Control+1 Control+2 Control+3 Control+4 Control+5 Control+6"
            title="Ctrl+1 to Ctrl+6">
      <option value="auto" selected>Auto</option>
      <option value="plain">Plain</option>
      <option value="elegant">Elegant</option>
      <option value="caffeinated">Caffeinated</option>
      <option value="drunken">Drunken</option>
      <option value="coarse">Coarse</option>
    </select>
    <label class="sound"><input type="checkbox" id="sound"> Sound</label>
  </div>
  <pre id="debug" aria-hidden="true" hidden></pre>
  <script src="js/main.js"></script>
</body>
</html>
