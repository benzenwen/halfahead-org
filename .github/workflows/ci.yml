# The offline gate on every pull request and on main: the Babashka suite,
# the .cljc tests again under node, the release build, and the Firestore
# rules under the emulator. Deploys nothing.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Babashka
        run: |
          curl -sSLo /tmp/install-bb https://raw.githubusercontent.com/babashka/babashka/master/install
          sudo bash /tmp/install-bb
          bb --version
      - name: Cache Maven and emulator downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.cache/firebase/emulators
          key: deps-${{ hashFiles('shadow-cljs.edn', 'bb.edn', 'package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - run: bb test
